name: Update Profile README

on:
  schedule:
    # 毎週月曜 UTC 0時（日本時間9時）
    - cron: '0 0 * * 1'
  push:
    branches: [main]
    paths:
      - 'profile-config.yaml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate README
        run: python src/generate.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '自動更新: README.mdを再生成'
          file_pattern: 'README.md'

  update-blog:
    runs-on: ubuntu-latest
    needs: generate-readme
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # profile-config.yamlのRSS URLを設定してください
          # 例: "https://qiita.com/YOUR_ID/feed,https://zenn.dev/YOUR_ID/feed"
          feed_list: ""
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"

  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: yuki-mtmr
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
